%YAML 1.2
---
$id: http://devicetree.org/schemas/nvmem/qcom,pmi8998-rc-trim.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMI8998 factory RC19P2 oscillator trim

maintainers:
  - adkaore <adkaore@gmail.com>

description: |
  Read-only view of the single factory trim byte at offset 0xf3 in the
  PMI8998 MISC peripheral at 0x900 on the base SPMI USID. NVMEM offset zero
  exposes this byte only. Bit 7 is the correction sign; bits 3:0 encode
  the absolute correction in 0.7 percent units. Other PMIC registers are
  not exposed and no writes or calibration programming are supported.

allOf:
  - $ref: nvmem.yaml#

properties:
  compatible:
    const: qcom,pmi8998-rc-trim

  reg:
    items:
      - const: 0x9f3

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    pmic {
        #address-cells = <1>;
        #size-cells = <0>;

        nvram@9f3 {
            compatible = "qcom,pmi8998-rc-trim";
            reg = <0x9f3>;
            nvmem-layout {
                compatible = "fixed-layout";
                #address-cells = <1>;
                #size-cells = <1>;
                rc_trim: trim@0 {
                    reg = <0 1>;
                };
            };
        };
    };
