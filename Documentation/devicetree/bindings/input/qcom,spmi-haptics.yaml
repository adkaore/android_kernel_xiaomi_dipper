%YAML 1.2
---
$id: http://devicetree.org/schemas/input/qcom,spmi-haptics.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Qualcomm PMI8998 buffer-mode LRA haptics

maintainers:
  - adkaore <adkaore@gmail.com>

description: |
  PMI8998 drives a linear resonant actuator using an internal waveform buffer.
  The driver implements ff-memless rumble. ERM, audio/PWM modes and downstream
  custom effect tables are not implemented. The factory RC oscillator trim
  must be supplied by NVMEM, not replaced with a constant from another device.

properties:
  compatible:
    items:
      - const: qcom,pmi8998-haptics
      - const: qcom,spmi-haptics

  reg:
    items:
      - const: 0xc000

  interrupts:
    minItems: 1
    items:
      - description: Short circuit
      - description: End of waveform buffer (unused for repeating rumble)

  interrupt-names:
    minItems: 1
    items:
      - const: short
      - const: play

  nvmem-cells:
    maxItems: 1

  nvmem-cell-names:
    const: rc-trim

  qcom,actuator-type:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0
    description: Linear resonant actuator.

  qcom,play-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 1
    description: Internal buffer mode.

  qcom,wave-shape:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 0
    description: Sine waveform.

  qcom,vmax-mv:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 116
    maximum: 3596
    description: Board voltage ceiling in millivolts; quantization rounds down.

  qcom,ilim-ma:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [400, 800]
    description: Hardware current limit in milliamps.

  qcom,sc-dbc-cycles:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [0, 8, 16, 32]
    description: Short-circuit debounce cycles.

  qcom,wave-play-rate-us:
    minimum: 5
    maximum: 20475
    description: Untrimmed resonance period in microseconds.

  qcom,lra-auto-res-mode:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [1, 2, 3, 4]
    description: Auto resonance mode (ZXD, QWD, maximum QWD, ZXD at end of pattern).

  qcom,lra-high-z:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 0
    maximum: 3
    description: High impedance interval hardware code.

  qcom,lra-res-cal-period:
    $ref: /schemas/types.yaml#/definitions/uint32
    enum: [4, 8, 16, 32]
    description: Resonance calibration period.

  qcom,brake-pattern:
    $ref: /schemas/types.yaml#/definitions/uint32-array
    minItems: 4
    maxItems: 4
    items:
      minimum: 0
      maximum: 3
    description: Four brake strengths, from zero to full drive voltage.

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - nvmem-cells
  - nvmem-cell-names
  - qcom,actuator-type
  - qcom,play-mode
  - qcom,wave-shape
  - qcom,vmax-mv
  - qcom,ilim-ma
  - qcom,sc-dbc-cycles
  - qcom,wave-play-rate-us
  - qcom,lra-auto-res-mode
  - qcom,lra-high-z
  - qcom,lra-res-cal-period
  - qcom,brake-pattern

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    pmic {
        #address-cells = <1>;
        #size-cells = <0>;
        interrupt-controller;
        #interrupt-cells = <4>;

        haptics@c000 {
            compatible = "qcom,pmi8998-haptics", "qcom,spmi-haptics";
            reg = <0xc000>;
            interrupts = <3 0xc0 0 IRQ_TYPE_EDGE_BOTH>;
            interrupt-names = "short";
            nvmem-cells = <&rc_trim>;
            nvmem-cell-names = "rc-trim";
            qcom,actuator-type = <0>;
            qcom,play-mode = <1>;
            qcom,wave-shape = <0>;
            qcom,vmax-mv = <3100>;
            qcom,ilim-ma = <800>;
            qcom,sc-dbc-cycles = <8>;
            qcom,wave-play-rate-us = <4878>;
            qcom,lra-auto-res-mode = <2>;
            qcom,lra-high-z = <1>;
            qcom,lra-res-cal-period = <4>;
            qcom,brake-pattern = <3 3 2 1>;
        };
    };
